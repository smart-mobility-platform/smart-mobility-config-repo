server:
  port: 8085

spring:
  application:
    name: smart-mobility-network-service

  datasource:
    url: ${NETWORK_DB_URL:jdbc:mysql://localhost:3306/networkdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${NETWORK_DB_USER:root}
    password: ${NETWORK_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
