# ============================================================
# Profil TEST — Billing Service
# Base de données H2 en mémoire pour les tests unitaires /
# d'intégration sans dépendance MySQL externe.
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:billingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

logging:
  level:
    com.smartmobility.billing: DEBUG
    org.hibernate.SQL: DEBUG
