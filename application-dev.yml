# ============================================================
# Profil DEV — configuration globale (surchargée par les fichiers
# spécifiques à chaque service si nécessaire)
# ============================================================

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  level:
    root: INFO
    com.smartmobility: DEBUG
    org.springframework: INFO
