# ============================================================
# Profil PROD — Notification Service
# Toutes les valeurs sensibles via variables d'environnement.
# ============================================================

spring:
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

logging:
  level:
    com.smartmobility.notification: INFO
    org.springframework.mail: WARN
