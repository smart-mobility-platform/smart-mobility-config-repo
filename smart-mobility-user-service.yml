# ============================================================
# Configuration du User & Mobility Pass Service
# Nom du service : smart-mobility-user-service
# Port           : 8081
# ============================================================

server:
  port: 8081

spring:
  application:
    name: smart-mobility-user-service

  # --- Base de données (valeurs surchargeables par profil) ---
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://localhost:3306/user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${USER_DB_USER:root}
    password: ${USER_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # --- Sécurité : OAuth2 Resource Server (Keycloak) ---
  security:
    oauth2:
      resourceserver:
        jwt:
          # jwk-set-uri pointe directement vers Keycloak en localhost.
          # Avantage : fonctionne quel que soit l'URL ngrok utilisé pour s'authentifier
          # (pas de validation de l'issuer → pas de mismatch ngrok).
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:9090/realms/smart-mobility/protocol/openid-connect/certs}
          # issuer-uri désactivé : il changeait à chaque redémarrage d'ngrok
          #issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/smart-mobility}

# ── Keycloak Admin Client (service account for user management) ──
keycloak:
  admin:
    server-url: ${KEYCLOAK_ADMIN_URL:https://8082-154-124-236-253.ngrok-free.app}
    realm: ${KEYCLOAK_REALM:smart-mobility}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:smart-mobility-admin-service}
    client-secret: WuSmptQnNA0XPZ4tvdZR46TDWCAfZE7e

