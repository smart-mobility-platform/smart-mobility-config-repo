# ============================================================
# Configuration du User & Mobility Pass Service
# Nom du service : smart-mobility-user-service
# Port           : 8081
# ============================================================

server:
  port: 8081

spring:
  application:
    name: smart-mobility-user-service

  # --- Base de données (valeurs surchargeables par profil) ---
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://localhost:3306/user_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${USER_DB_USER:root}
    password: ${USER_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # --- Sécurité : OAuth2 Resource Server (Keycloak) ---
  security:
    oauth2:
      resourceserver:
        jwt:
          # URI d'émission des tokens Keycloak.
          # Spring Security télécharge automatiquement le JWKS depuis
          # {issuer-uri}/.well-known/openid-configuration pour valider les JWT.
          #issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/smart-mobility}

          #si ngrok 
          issuer-uri: https://3b6c-154-124-143-236.ngrok-free.app/realms/smart-mobility

