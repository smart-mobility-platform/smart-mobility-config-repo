# ============================================================
# Profil TEST — Pricing Service
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:pricingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

pricing:
  base-fare: 500
  off-peak-discount: 0.20
  daily-cap: 3000
  loyalty-threshold: 20
  loyalty-discount: 0.15

logging:
  level:
    com.smartmobility.pricing: DEBUG
    org.hibernate.SQL: DEBUG
