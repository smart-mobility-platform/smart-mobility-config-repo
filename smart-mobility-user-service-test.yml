# ============================================================
# Profil TEST — User & Mobility Pass Service
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:user_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/smart-mobility

logging:
  level:
    com.smartmobility.user: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: WARN
