# ============================================================
# Configuration du Notification Service
# Nom du service : smart-mobility-notification-service
# Port           : 8086
# ============================================================

server:
  port: 8086

spring:
  application:
    name: smart-mobility-notification-service

  # --- Configuration e-mail (surcharger avec les vraies valeurs en prod) ---
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # --- RabbitMQ : connexion au broker de messages ---
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
